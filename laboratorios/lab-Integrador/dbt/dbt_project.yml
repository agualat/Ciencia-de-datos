name: nyc_taxi
version: "1.0.0"
config-version: 2
profile: nyc_taxi

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Rango cubierto por dim_date. Debe incluir todos los meses cargados en Bronze.
  date_start: "2025-01-01"
  date_end: "2026-12-31"

models:
  nyc_taxi:
    silver:
      +schema: silver
      +materialized: view
    gold:
      +schema: gold
      +materialized: table

seeds:
  nyc_taxi:
    +schema: silver
